<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>IPTV Player</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#111827;
    color:#fff;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

/* Sidebar */

.sidebar{
    width:340px;
    background:#0f172a;
    border-right:1px solid rgba(255,255,255,0.08);
    display:flex;
    flex-direction:column;
}

.logo{
    padding:18px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    font-size:22px;
    font-weight:700;
}

.search-box{
    padding:14px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.search-box input{
    width:100%;
    padding:12px 14px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#1e293b;
    color:#fff;
    font-size:14px;
}

.group-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.group-tabs button{
    border:none;
    background:#1e293b;
    color:#fff;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    font-size:13px;
}

.group-tabs button.active{
    background:#2563eb;
}

.channel-list{
    flex:1;
    overflow-y:auto;
}

.channel{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    cursor:pointer;
    transition:0.2s;
}

.channel:hover{
    background:#1e293b;
}

.channel.active{
    background:#1d4ed8;
}

.channel img{
    width:52px;
    height:52px;
    object-fit:contain;
    border-radius:8px;
    background:#fff;
    padding:4px;
}

.channel-info{
    overflow:hidden;
}

.channel-name{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.channel-group{
    font-size:12px;
    opacity:0.7;
    margin-top:3px;
}

/* Player */

.player-section{
    flex:1;
    display:flex;
    flex-direction:column;
    background:#000;
}

.video-container{
    flex:1;
    position:relative;
    background:#000;
}

video{
    width:100%;
    height:100%;
    background:#000;
}

.now-playing{
    padding:14px 18px;
    background:#0f172a;
    border-top:1px solid rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.now-playing h2{
    font-size:18px;
}

/* Mobile */

.mobile-top{
    display:none;
}

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .app{
        flex-direction:column;
        height:auto;
    }

    .sidebar{
        width:100%;
        height:50vh;
        border-right:none;
        border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .player-section{
        height:50vh;
    }

    .mobile-top{
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:14px;
        background:#0f172a;
        border-bottom:1px solid rgba(255,255,255,0.08);
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="sidebar">

        <div class="logo">
            IPTV Player
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search channel...">
        </div>

        <div class="group-tabs" id="groupTabs"></div>

        <div class="channel-list" id="channelList"></div>

    </div>

    <div class="player-section">

        <div class="video-container">
            <video id="video" controls autoplay playsinline></video>
        </div>

        <div class="now-playing">
            <h2 id="nowPlaying">Select a channel</h2>
            <span id="channelCount"></span>
        </div>

    </div>

</div>

<script>
const playlistUrl = "https://raw.githubusercontent.com/emonbhuiyan/IP-TV/refs/heads/main/aynaott.m3u";

const channelList = document.getElementById("channelList");
const groupTabs = document.getElementById("groupTabs");
const searchInput = document.getElementById("searchInput");
const nowPlaying = document.getElementById("nowPlaying");
const channelCount = document.getElementById("channelCount");

const video = document.getElementById("video");

let channels = [];
let currentGroup = "All";

async function loadPlaylist() {

    const response = await fetch(playlistUrl);
    const text = await response.text();

    parseM3U(text);

    renderGroups();
    renderChannels();
}

function parseM3U(data){

    const lines = data.split("\n");

    for(let i=0; i<lines.length; i++){

        const line = lines[i].trim();

        if(line.startsWith("#EXTINF")){

            const info = line;

            const url = lines[i + 1]?.trim();

            const logoMatch = info.match(/tvg-logo="(.*?)"/);
            const groupMatch = info.match(/group-title="(.*?)"/);
            const nameMatch = info.split(",");

            const channel = {
                name: nameMatch[nameMatch.length - 1] || "Unknown",
                logo: logoMatch ? logoMatch[1] : "",
                group: groupMatch ? groupMatch[1] : "Other",
                url: url
            };

            channels.push(channel);
        }
    }

    channelCount.innerText = `${channels.length} Channels`;
}

function renderGroups(){

    const groups = ["All", ...new Set(channels.map(c => c.group))];

    groupTabs.innerHTML = "";

    groups.forEach(group => {

        const btn = document.createElement("button");

        btn.innerText = group;

        if(group === currentGroup){
            btn.classList.add("active");
        }

        btn.onclick = () => {
            currentGroup = group;
            renderGroups();
            renderChannels();
        };

        groupTabs.appendChild(btn);
    });
}

function renderChannels(){

    const search = searchInput.value.toLowerCase();

    channelList.innerHTML = "";

    const filtered = channels.filter(channel => {

        const groupMatch = currentGroup === "All" || channel.group === currentGroup;

        const searchMatch =
            channel.name.toLowerCase().includes(search);

        return groupMatch && searchMatch;
    });

    filtered.forEach((channel,index) => {

        const item = document.createElement("div");
        item.className = "channel";

        item.innerHTML = `
            <img src="${channel.logo}" alt="${channel.name}">
            <div class="channel-info">
                <div class="channel-name">${channel.name}</div>
                <div class="channel-group">${channel.group}</div>
            </div>
        `;

        item.onclick = () => {

            document.querySelectorAll(".channel").forEach(c=>{
                c.classList.remove("active");
            });

            item.classList.add("active");

            playChannel(channel);

        };

        channelList.appendChild(item);

        if(index === 0 && !video.src){
            item.click();
        }

    });
}

function playChannel(channel){

    nowPlaying.innerText = channel.name;

    if(Hls.isSupported()){

        if(window.hls){
            window.hls.destroy();
        }

        const hls = new Hls();

        hls.loadSource(channel.url);
        hls.attachMedia(video);

        window.hls = hls;

    }else if(video.canPlayType("application/vnd.apple.mpegurl")){

        video.src = channel.url;
    }
}

searchInput.addEventListener("input", renderChannels);

loadPlaylist();
</script>

</body>
</html>
